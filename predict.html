<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predict | Academic Potential</title>
    <link rel="stylesheet" href="style/predict.css" />
</head>

<body>
    <header>
        <h1>Evaluating Academic Potential</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="predict.html">Predict</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="predict-section">
        <div class="form-container">
            <h2>Predict</h2>
            <form id="predictForm" onsubmit="return validateForm()">
                <label for="course">Course:</label>
                <input type="text" id="course" name="course" required />

                <label for="gpa">GPA:</label>
                <input type="number" id="gpa" name="gpa" step="0.1" min="0" max="10" required />

                <label for="activities">Extracurricular Activities:</label>
                <select id="activities" name="activities">
                    <option value="None">None</option>
                    <option value="Few">Few</option>
                    <option value="Active">Active</option>
                </select>

                <label for="hours">Study Hours/Week:</label>
                <input type="number" id="hours" name="hours" required />

                <label for="recommendation">Recommendation Letters:</label>
                <select id="recommendation" name="recommendation">
                    <option value="None">None</option>
                    <option value="One">One</option>
                    <option value="Multiple">Multiple</option>
                </select>

                <button type="submit">Predict</button>
            </form>
        </div>
        <div class="predict-img">
            <img src="assets/predict-illustration.png" alt="AI Illustration" />
        </div>
    </main>

    <script>
        document.getElementById("predictForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = {
                course: document.getElementById("course").value,
                gpa: document.getElementById("gpa").value,
                activities: document.getElementById("activities").value,
                hours: document.getElementById("hours").value,
                recommendation: document.getElementById("recommendation").value,
            };

            const fields = ["course", "gpa", "activities", "hours", "recommendation"];
            let isValid = true;

            fields.forEach(id => {
                const input = document.getElementById(id);
                if (!input.value.trim()) {
                    input.style.border = "2px solid red";
                    isValid = false;
                } else {
                    input.style.border = "1px solid #ccc";
                }
            });

            if (!isValid) {
                alert("Please fill out all fields!");
                return;
            }


            fetch("backend/save_prediction.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(formData),
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        window.location.href = `result.html?score=${data.score}`;
                    } else {
                        alert("Failed to save prediction!");
                    }
                })
                .catch(err => {
                    console.error("Error:", err);
                });
        });
    </script>

</body>

</html>
